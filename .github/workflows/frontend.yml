name: Merken frontend
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 image
        run: docker build -t merken-frontend:ci .
      - name: Smoke test
        run: |
          docker run -d --name merken-ci -p 127.0.0.1:3001:3000 merken-frontend:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/ > /dev/null
      - name: Save image
        if: github.ref == 'refs/heads/main'
        run: docker save merken-frontend:ci | gzip > frontend.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-arm64
          path: frontend.tar.gz
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && vars.EC2_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: [self-hosted, linux, ARM64, merken-frontend]
    environment: production
    concurrency:
      group: merken-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-arm64
      - run: bash deploy/deploy.sh
