name: Merken frontend CI/CD via SSM
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 image
        run: docker build -t merken-frontend:${{ github.sha }} .
      - name: Verify login and protected API in the built image
        run: |
          docker run -d --name merken-ci -p 127.0.0.1:3001:3000 \
            -e ORBIT_PUBLIC_ORIGIN=http://localhost:3001 \
            -e ORBIT_DEMO_PASSWORD="$(openssl rand -hex 24)" \
            -e ORBIT_DEMO_SESSION_SECRET="$(openssl rand -hex 32)" \
            merken-frontend:${{ github.sha }}
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/login >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/dashboard)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = 307
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save merken-frontend:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: frontend-arm64
          path: image.tar.gz
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_ARTIFACT_BUCKET: ${{ secrets.DEPLOY_ARTIFACT_BUCKET }}
      SSM_INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
      DEPLOY_APP: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-arm64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: merken-frontend-${{ github.run_id }}
      - name: Deploy verified image through SSM
        run: python3 deploy/ssm_deploy.py
