name: Merken frontend CI/CD to clawbot via SSH
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test restricted deployment gate
        run: python3 -m unittest discover -s deploy -p "test_clawbot_deploy.py"
      - name: Build AMD64 image
        run: docker build -t merken-frontend:${{ github.sha }} .
      - name: Test dashboard data and display rules in the built image
        run: |
          docker run --rm --entrypoint node \
            --mount type=bind,src="${{ github.workspace }}/lib",dst=/checks,readonly \
            merken-frontend:${{ github.sha }} --test \
            /checks/crew-display.test.mjs /checks/dashboard-crew.test.mjs \
            /checks/metric-status.test.mjs /checks/reading-window.test.mjs /checks/recommendations-api.test.mjs /checks/saved-recommendations.test.mjs /checks/observation-history.test.mjs
      - name: Verify login and protected API in the built image
        run: |
          docker run -d --name merken-ci -p 127.0.0.1:3001:3000 \
            -e ORBIT_PUBLIC_ORIGIN=http://localhost:3001 \
            -e ORBIT_DEMO_PASSWORD="$(openssl rand -hex 24)" \
            -e ORBIT_DEMO_SESSION_SECRET="$(openssl rand -hex 32)" \
            merken-frontend:${{ github.sha }}
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:3001/login >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/dashboard)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = 307
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save merken-frontend:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: frontend-amd64
          path: image.tar.gz
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLAWBOT_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: frontend-clawbot
      cancel-in-progress: false
    env:
      CLAWBOT_HOST: ${{ secrets.CLAWBOT_HOST }}
      CLAWBOT_PORT: ${{ secrets.CLAWBOT_PORT }}
      CLAWBOT_USER: ${{ secrets.CLAWBOT_USER }}
      CLAWBOT_SSH_PRIVATE_KEY: ${{ secrets.CLAWBOT_SSH_PRIVATE_KEY }}
      CLAWBOT_KNOWN_HOSTS: ${{ secrets.CLAWBOT_KNOWN_HOSTS }}
      DEPLOY_APP: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-amd64
      - name: Deploy tested image to clawbot over pinned SSH
        run: python3 deploy/ssh_deploy.py
